server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-X9Y89nEwDXiB6r5r6XTq1HJkHgow7dwgdlxpHHzXbQI='; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Noms de fichiers sans empreinte : le HTML, le CSS et le JS se revalident à chaque visite
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-X9Y89nEwDXiB6r5r6XTq1HJkHgow7dwgdlxpHHzXbQI='; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    }

    # Sans « always » : un 404 ne garde pas ce cache d'une semaine, sinon Cloudflare
    # continue de le servir après le déploiement qui ajoute le fichier
    location ~* \.(?:woff2|webp|png|ico|mp4)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
