<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Precise Gunplay — vidéo de présentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500&display=block" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <!-- Fond permanent -->
    <div class="bg-layer" id="bg-grid"></div>
    <div class="bg-layer" id="bg-glow"></div>
    <div class="bg-layer" id="bg-dots"></div>
    <div class="bg-layer" id="bg-shards"></div>

    <!-- Scènes (remplies par scenes.js) -->
    <div id="scenes"></div>

    <!-- Habillage HUD -->
    <div class="bg-layer" id="hud">
      <div class="hud-corner" id="hud-tl"></div><div class="hud-corner" id="hud-tr"></div>
      <div class="hud-corner" id="hud-bl"></div><div class="hud-corner" id="hud-br"></div>
      <div class="hud" id="hud-time">PG // 00:00:00</div>
      <div class="hud" id="hud-page">PRECISE GUNPLAY</div>
      <div id="hud-bar"><i></i></div>
    </div>

    <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l16 10-7 1.5L9.5 21z" fill="#fff" stroke="#0b131b" stroke-width="1.4" stroke-linejoin="round"/></svg>
    <div id="cursor-ring" style="position:absolute;left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid #ff4655;opacity:0;z-index:49"></div>

    <div id="wipe"><div class="w w1"></div><div class="w w2"></div><div class="w w3"></div></div>
    <div id="flash"></div>
    <div class="bg-layer" id="vignette"></div>
  </div>

  <div id="player">
    <button id="play">Lecture</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" />
    <span id="clock">0.00 s</span>
  </div>

  <script src="node_modules/gsap/dist/gsap.min.js"></script>
  <script src="scenes.js"></script>
</body>
</html>
